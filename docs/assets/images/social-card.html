<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recurate Social Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1424 100%);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.3);
        }

        .logo img {
            width: 90px;
            height: 90px;
        }

        .brand {
            font-size: 70px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.025em;
            line-height: 1;
        }

        .accent-rule {
            width: 88px;
            height: 4px;
            background: #6366f1;
            margin-top: 44px;
            border-radius: 2px;
        }

        h1 {
            font-size: 58px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 28px;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        p.tagline {
            font-size: 26px;
            color: #a1a8c3;
            margin-top: 22px;
            font-weight: 400;
        }

        .bottom {
            font-size: 18px;
            color: #a1a8c3;
            border-top: 1px solid #2a3050;
            padding-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .by .name { color: #ffffff; font-weight: 600; }
        .hub { color: #67e8f9; font-weight: 500; letter-spacing: 0.01em; }
    </style>
</head>
<body>
    <div>
        <div class="top">
            <div class="logo"><img src="recurate-icon.svg" alt="Recurate"></div>
            <span class="brand">Recurate</span>
        </div>
        <div class="accent-rule"></div>
        <h1>Don't just chat, recurate.</h1>
        <p class="tagline">Annotation tools for AI conversations.</p>
    </div>
    <div class="bottom">
        <span class="by">Built by <span class="name">Nikhil Singhal</span></span>
        <span class="hub">nikhilsinghal.com</span>
    </div>
</body>
</html>
